name: Update APT Repository

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-apt-repo]
  schedule:
    # Off the hour: scheduled jobs on the hour queue behind everyone else's.
    - cron: '17 6 * * *'

# Two jobs on purpose. Building the repository needs the signing key;
# publishing it needs write access to this repository. Keeping them apart
# means the third-party action that publishes never runs in a job where
# GPG_PRIVATE_KEY exists, so a compromised release of it cannot reach the key
# that signs every package people install.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install reprepro
      run: sudo apt-get update && sudo apt-get install -y reprepro

    - name: Import GPG key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Download debs from releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p debs
        mapfile -t repos < <(awk -F'\t' '!/^#/ && NF>0 {print $1}' packages.tsv)
        for repo in "${repos[@]}"; do
          echo "Fetching latest release from ${repo}..."
          gh release download --repo "${repo}" --pattern "*.deb" --dir debs 2>/dev/null || echo "  No release found for ${repo}"
        done
        echo "Downloaded debs:"
        ls -la debs/ || echo "No debs found"

    - name: Build repository
      run: |
        mkdir -p site/conf
        cp conf/distributions site/conf/
        for deb in debs/*.deb; do
          [ -f "$deb" ] || continue
          echo "Adding ${deb}..."
          reprepro -V --basedir ./site includedeb bookworm "${deb}" 2>&1 || echo "  Skipped ${deb}"
        done
        cp public.key site/
        rm -rf site/conf site/db
        ./generate-index.sh site/index.html

    - name: Hand the built repository to the publishing job
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: apt-site
        path: site
        retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # No GPG key in this job. It publishes what build produced and signed.
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: apt-site
        path: site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        force_orphan: true
