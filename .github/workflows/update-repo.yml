name: Update APT Repository

on:
  workflow_dispatch:
  schedule:
    # Off the hour: scheduled jobs on the hour queue behind everyone else's.
    - cron: '17 6 * * *'

# Two jobs on purpose. Building the repository needs the signing key;
# publishing it needs write access to this repository. Keeping them apart
# means the third-party action that publishes never runs in a job where
# GPG_PRIVATE_KEY exists, so a compromised release of it cannot reach the key
# that signs every package people install.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - run: shellcheck -x ./*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Before the key is imported: a bad packages.tsv or conf/distributions
    # stops the run here.
    - run: ./check-config.sh

    - uses: ./.github/actions/install-reprepro

    - name: Import GPG key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Build repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./build-site.sh site

    # build-site.sh skips what it cannot fetch, add or sign and still exits 0.
    # Failing here uploads nothing, so publish is skipped and yesterday's
    # repository stays live.  The empty keyring shows the check needs only the
    # public.key the site publishes, as a user's machine would have.
    - name: Check the built repository
      run: GNUPGHOME="$(mktemp -d)" ./check-site.sh site

    - name: Hand the built repository to the publishing job
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: apt-site
        path: site
        retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # No GPG key in this job. It publishes what build produced and signed.
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: apt-site
        path: site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        force_orphan: true
