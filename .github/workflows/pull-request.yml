name: Pull request

# No paths filter: every job reports on every pull request, so any of them can
# be made a required status check.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here reads a secret, so it all works for Dependabot and forks.
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - run: shellcheck -x ./*.sh

  # The release binary is fetched at a fixed version and checked against a
  # fixed digest rather than installed by the project's download script,
  # which would be a remote script piped into a shell.
  actionlint:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.7.12
      SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install actionlint
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="actionlint_${VERSION}_linux_amd64.tar.gz"
        gh release download "v${VERSION}" --repo rhysd/actionlint \
          --pattern "$archive" --dir "$RUNNER_TEMP"
        echo "${SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP" actionlint
    - run: '"$RUNNER_TEMP/actionlint" -color'

  check-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - run: ./check-config.sh
    - name: Check that the README package table matches packages.tsv
      run: ./update-packages.sh && git diff --exit-code README.md

  dry-run-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./.github/actions/install-reprepro
    - name: Build, sign with a throwaway key, and point apt at the result
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./dry-run.sh site
